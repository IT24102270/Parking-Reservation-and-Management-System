<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Manager Dashboard - City Park Solutions Pvt Ltd</title>
    <link rel="stylesheet" th:href="@{/css/global-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 25%, #34495e 50%, #7f8c8d 75%, #d4d8dd 100%);
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
        }
        
        .slot-manager-container {
            min-height: 100vh;
        }
        
        .slot-header {
            background: var(--color-surface);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .slot-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .slot-logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-inverse);
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
        }
        
        .slot-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
            margin: 0;
        }
        
        .slot-subtitle {
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
            margin: 0;
        }
        
        .slot-nav {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            margin: 0 var(--spacing-lg) var(--spacing-lg);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-base);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav-tabs {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: var(--spacing-sm);
        }
        
        .nav-tab {
            flex: 1;
        }
        
        .nav-tab a {
            display: block;
            padding: var(--spacing-md) var(--spacing-lg);
            text-decoration: none;
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
            border-radius: var(--radius-lg);
            transition: all var(--transition-base);
            text-align: center;
        }
        
        .nav-tab.active a {
            background: var(--gradient-primary);
            color: var(--color-text-inverse);
            box-shadow: var(--shadow-base);
        }
        
        .nav-tab:not(.active) a:hover {
            background: rgba(52, 152, 219, 0.1);
            color: var(--color-text-primary);
        }
        
        .main-content {
            padding: 0 var(--spacing-lg) var(--spacing-lg);
        }
        
        .content-header {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-base);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .page-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
            margin: 0;
        }
        
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
        }
        
        .slot-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-base);
            transition: all var(--transition-base);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .slot-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .slot-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        
        .slot-number {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }
        
        .slot-status {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
            text-transform: uppercase;
        }
        
        .status-available {
            background: rgba(39, 174, 96, 0.1);
            color: var(--color-success);
        }
        
        .status-occupied {
            background: rgba(231, 76, 60, 0.1);
            color: var(--color-error);
        }
        
        .status-maintenance {
            background: rgba(243, 156, 18, 0.1);
            color: var(--color-warning);
        }
        
        .slot-details {
            margin-bottom: var(--spacing-lg);
        }
        
        .slot-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
            font-size: var(--font-size-sm);
        }
        
        .slot-detail-label {
            color: var(--color-text-secondary);
        }
        
        .slot-detail-value {
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
        }
        
        .alert {
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            margin: 0 var(--spacing-lg) var(--spacing-lg);
            font-weight: var(--font-weight-medium);
        }
        
        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(39, 174, 96, 0.2);
        }
        
        @media (max-width: 768px) {
            .slot-header {
                flex-direction: column;
                text-align: center;
                gap: var(--spacing-lg);
            }
            
            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-md);
            }
            
            .nav-tabs {
                flex-direction: column;
            }
            
            .slots-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Header Styles */
        header {
            background: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-gray);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: var(--dark-blue);
        }

        /* Navigation Styles */
        nav {
            background: white;
            border-top: 1px solid var(--medium-gray);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .nav-tabs {
            display: flex;
            list-style: none;
        }

        .nav-tab {
            padding: 15px 25px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .nav-tab:hover {
            background: var(--light-gray);
        }

        .nav-tab.active {
            color: var(--primary-blue);
            border-bottom: 3px solid var(--primary-blue);
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-gray);
        }

        .add-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            text-decoration: none;
        }

        .add-btn:hover {
            background: var(--dark-blue);
        }

        /* Parking Slots Grid */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .slot-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .slot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .slot-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-gray);
        }

        .slot-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-available {
            background: rgba(46, 204, 113, 0.2);
            color: var(--available-color);
        }

        .status-occupied {
            background: rgba(231, 76, 60, 0.2);
            color: var(--occupied-color);
        }

        .status-maintenance {
            background: rgba(243, 156, 18, 0.2);
            color: var(--maintenance-color);
        }

        .slot-details {
            margin-bottom: 15px;
        }

        .slot-detail {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .slot-detail-label {
            color: var(--dark-gray);
        }

        .slot-detail-value {
            font-weight: 500;
        }

        .edit-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
            display: block;
            text-align: center;
            margin-top: 10px;
        }

        .edit-btn:hover {
            background: var(--dark-blue);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .slots-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .header-container, .nav-container, .container {
                padding: 0 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .nav-tabs {
                overflow-x: auto;
                white-space: nowrap;
            }

            .slots-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .slots-grid {
                grid-template-columns: 1fr;
            }

            .user-profile span {
                display: none;
            }
        }
        /* Alert Styles */
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div class="slot-manager-container">
        <!-- Header -->
        <div class="slot-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="slot-logo">
                <div class="slot-logo-icon">CPS</div>
                <div>
                    <h1 class="slot-title">Slot Manager Dashboard</h1>
                    <p class="slot-subtitle">City Park Solutions Pvt Ltd</p>
                </div>
            </div>
            <div>
                <a href="/logout" class="btn btn-outline">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </div>

        <!-- Navigation -->
        <div class="slot-nav">
            <ul class="nav-tabs">
                <li class="nav-tab" th:classappend="${currentLocation}=='TwoWheeler' ? ' active'">
                    <a th:href="@{/slotmanager/dashboard(location='TwoWheeler')}">
                        <i class="fas fa-motorcycle"></i>
                        Two Wheels
                    </a>
                </li>
                <li class="nav-tab" th:classappend="${currentLocation}=='ThreeWheeler' ? ' active'">
                    <a th:href="@{/slotmanager/dashboard(location='ThreeWheeler')}">
                        <i class="fas fa-taxi"></i>
                        Three Wheels
                    </a>
                </li>
                <li class="nav-tab" th:classappend="${currentLocation}=='FourWheeler' ? ' active'">
                    <a th:href="@{/slotmanager/dashboard(location='FourWheeler')}">
                        <i class="fas fa-car"></i>
                        Four Wheels
                    </a>
                </li>
                <li class="nav-tab" th:classappend="${currentLocation}=='HeavyVehicle' ? ' active'">
                    <a th:href="@{/slotmanager/dashboard(location='HeavyVehicle')}">
                        <i class="fas fa-truck"></i>
                        Heavy Vehicles
                    </a>
                </li>
            </ul>
        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <h2 class="page-title" th:text="${#strings.replace(currentLocation,'Wheeler',' Wheel')} + ' Parking Slots'"></h2>
                <a th:href="@{/slotmanager/updateslot(location=${currentLocation})}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Add Slot
                </a>
            </div>

            <div class="slots-grid">
                <div class="slot-card" th:each="slot : ${slots}">
                    <div class="slot-card-header">
                        <div class="slot-number">Slot <span th:text="${slot.id}"></span></div>
                        <div class="slot-status" th:classappend="'status-' + ${slot.status}" th:text="${#strings.capitalize(slot.status)}"></div>
                    </div>
                    <div class="slot-details">
                        <div class="slot-detail">
                            <span class="slot-detail-label">Hourly Rate:</span>
                            <span class="slot-detail-value" th:text="'$' + ${#numbers.formatDecimal(slot.hourlyRate, 1, 2)}"></span>
                        </div>
                    </div>
                    <a th:href="@{/slotmanager/updateslot(id=${slot.id}, location=${currentLocation})}" class="btn btn-secondary" style="width: 100%; margin-top: var(--spacing-md);">
                        <i class="fas fa-edit"></i>
                        Edit Slot
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
