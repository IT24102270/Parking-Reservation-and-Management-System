<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help & Support - City Park Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Enhanced Color Palette */
            --color-navy-darkest: #1e2a3a;
            --color-navy-dark: #2c3e50;
            --color-navy-medium: #34495e;
            --color-slate-blue: #4a5f7a;
            --color-blue-gray: #7f8c8d;
            --color-gray-medium: #95a5a6;
            --color-gray-light: #bdc3c7;
            --color-gray-lightest: #ecf0f1;
            
            /* UI Colors */
            --primary-blue: #4a5f7a;
            --dark-blue: #2c3e50;
            --text-color: #1e2a3a;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(30, 42, 58, 0.1);
            --shadow-md: 0 8px 16px rgba(30, 42, 58, 0.1);
            --shadow-lg: 0 16px 32px rgba(30, 42, 58, 0.15);
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --info-color: #3498db;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--color-navy-darkest) 0%, var(--color-navy-dark) 25%, var(--color-navy-medium) 50%, var(--color-blue-gray) 75%, var(--color-gray-lightest) 100%);
            min-height: 100vh;
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .support-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .support-header {
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(74, 95, 122, 0.1);
        }
        
        .support-header h1 {
            color: var(--color-navy-dark);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .support-header h1 i {
            color: var(--color-slate-blue);
            margin-right: 10px;
        }
        
        .support-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
        
        .support-form {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(74, 95, 122, 0.1);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-navy-dark);
            font-weight: 600;
        }

        .form-group label i {
            color: var(--color-slate-blue);
            margin-right: 8px;
        }
        
        .form-group select,
        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--color-gray-light);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
        }
        
        .form-group select:focus,
        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--color-slate-blue);
            box-shadow: 0 0 0 3px rgba(74, 95, 122, 0.1);
            background: white;
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .priority-options {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .priority-option {
            flex: 1;
        }
        
        .priority-option input[type="radio"] {
            display: none;
        }
        
        .priority-option label {
            display: block;
            padding: 0.75rem;
            text-align: center;
            border: 2px solid var(--color-gray-light);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-color);
            font-weight: 500;
        }
        
        .priority-option input[type="radio"]:checked + label {
            border-color: var(--color-slate-blue);
            background: rgba(74, 95, 122, 0.1);
            color: var(--color-slate-blue);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .priority-low label { border-left: 4px solid var(--success-color); }
        .priority-medium label { border-left: 4px solid var(--warning-color); }
        .priority-high label { border-left: 4px solid var(--danger-color); }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            color: white;
            box-shadow: var(--shadow);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--color-navy-medium), var(--color-navy-dark));
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background: rgba(74, 95, 122, 0.1);
            color: var(--color-slate-blue);
            border: 2px solid var(--color-slate-blue);
        }
        
        .btn-secondary:hover {
            background: var(--color-slate-blue);
            color: white;
            transform: translateY(-2px);
        }
        
        .quick-help {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(74, 95, 122, 0.1);
            border-radius: 16px;
            border-left: 4px solid var(--color-slate-blue);
            box-shadow: var(--shadow);
        }
        
        .quick-help h3 {
            color: var(--color-navy-dark);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .quick-help h3 i {
            color: var(--color-slate-blue);
            margin-right: 8px;
        }
        
        .quick-help-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .quick-help-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .quick-help-item i {
            color: var(--color-slate-blue);
        }
        
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        
        .alert-success {
            background: rgba(39, 174, 96, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(39, 174, 96, 0.3);
        }
        
        .alert-error {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger-color);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="support-container">
        <!-- Header -->
        <div class="support-header">
            <h1><i class="fas fa-life-ring"></i> Get Help & Support</h1>
            <p>We're here to help! Describe your issue and we'll get back to you within 24 hours.</p>
        </div>
        
        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}">Success message</span>
        </div>
        
        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Error message</span>
        </div>
        
        <!-- Support Form -->
        <form class="support-form" th:action="@{/customer/support/submit}" method="post">
            <div class="form-group">
                <label for="issueType">
                    <i class="fas fa-tag"></i> Issue Type
                </label>
                <select id="issueType" name="issueType" required>
                    <option value="">Select issue type...</option>
                    <option value="PAYMENT">💳 Payment Issues</option>
                    <option value="BOOKING">🅿️ Booking Problems</option>
                    <option value="TECHNICAL">🔧 Technical Issues</option>
                    <option value="GENERAL">💬 General Inquiry</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>
                    <i class="fas fa-exclamation-triangle"></i> Priority Level
                </label>
                <div class="priority-options">
                    <div class="priority-option priority-low">
                        <input type="radio" id="priority-low" name="priority" value="LOW">
                        <label for="priority-low">
                            <i class="fas fa-circle" style="color: #10b981;"></i>
                            Low
                        </label>
                    </div>
                    <div class="priority-option priority-medium">
                        <input type="radio" id="priority-medium" name="priority" value="MEDIUM" checked>
                        <label for="priority-medium">
                            <i class="fas fa-circle" style="color: #f59e0b;"></i>
                            Medium
                        </label>
                    </div>
                    <div class="priority-option priority-high">
                        <input type="radio" id="priority-high" name="priority" value="HIGH">
                        <label for="priority-high">
                            <i class="fas fa-circle" style="color: #ef4444;"></i>
                            High
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="description">
                    <i class="fas fa-comment-alt"></i> Describe Your Issue
                </label>
                <textarea id="description" name="description" 
                         placeholder="Please provide as much detail as possible about your issue. Include any error messages, steps you took, and what you expected to happen..."
                         required></textarea>
            </div>
            
            <div class="form-actions">
                <a href="/customer/dashboard" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                    Submit Support Request
                </button>
            </div>
        </form>
        
        <!-- Quick Help Section -->
        <div class="quick-help">
            <h3><i class="fas fa-lightbulb"></i> Quick Help</h3>
            <div class="quick-help-items">
                <div class="quick-help-item">
                    <i class="fas fa-question-circle"></i>
                    <span>Check our FAQ section</span>
                </div>
                <div class="quick-help-item">
                    <i class="fas fa-phone"></i>
                    <span>Call: +94 11 234 5678</span>
                </div>
                <div class="quick-help-item">
                    <i class="fas fa-envelope"></i>
                    <span>Email: support@cityparksolutions.lk</span>
                </div>
                <div class="quick-help-item">
                    <i class="fas fa-clock"></i>
                    <span>Response time: 24 hours</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Form validation and enhancement
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.support-form');
            const issueType = document.getElementById('issueType');
            const description = document.getElementById('description');
            
            // Auto-focus description when issue type is selected
            issueType.addEventListener('change', function() {
                if (this.value) {
                    description.focus();
                }
            });
            
            // Form submission validation
            form.addEventListener('submit', function(e) {
                if (!issueType.value || !description.value.trim()) {
                    e.preventDefault();
                    alert('Please fill in all required fields.');
                    return;
                }
                
                if (description.value.trim().length < 10) {
                    e.preventDefault();
                    alert('Please provide more details about your issue (at least 10 characters).');
                    return;
                }
                
                // Show loading state
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
                submitBtn.disabled = true;
            });
        });
    </script>
</body>
</html>
