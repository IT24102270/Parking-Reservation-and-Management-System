<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Action Logs - File View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- External Resources -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .log-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .log-line {
            padding: 0.3rem 0;
            border-bottom: 1px solid #e9ecef;
            word-wrap: break-word;
        }
        
        .log-line:hover {
            background-color: #e9ecef;
        }
        
        .log-timestamp {
            color: #6c757d;
            font-weight: bold;
        }
        
        .log-admin {
            color: #dc3545;
            font-weight: bold;
        }
        
        .log-action {
            color: #28a745;
            font-weight: bold;
        }
        
        .log-target {
            color: #fd7e14;
        }
        
        .log-details {
            color: #495057;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .separator-line {
            background: #007bff;
            color: white;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="fas fa-file-alt me-2"></i>Admin Action Logs - File View</h2>
                    <div>
                        <a href="/admin/dashboard" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="stats-card">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <h3 th:text="${logLines != null ? logLines.size() : 0}">0</h3>
                            <p class="mb-0">Total Log Lines</p>
                        </div>
                        <div class="col-md-4">
                            <h3 th:text="${currentAdmin}">Unknown</h3>
                            <p class="mb-0">Current Admin</p>
                        </div>
                        <div class="col-md-4">
                            <h3><i class="fas fa-file-alt"></i></h3>
                            <p class="mb-0">File Logs</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Logs Container -->
        <div class="log-container">
            <h5 class="mb-3"><i class="fas fa-file-alt me-2"></i>Admin Action Log File</h5>
            <p class="text-muted mb-3">
                <strong>File Path:</strong> <span th:text="${logFilePath}">admin-actions.log</span>
            </p>
            
            <!-- Empty State -->
            <div th:if="${logLines == null || #lists.isEmpty(logLines)}" class="text-center py-5">
                <i class="fas fa-file-alt fa-3x text-muted mb-3"></i>
                <h5 class="text-muted">No log entries found</h5>
                <p class="text-muted">Admin actions will appear here once they are performed.</p>
            </div>

            <!-- Log Lines -->
            <div th:if="${logLines != null && !#lists.isEmpty(logLines)}">
                <div th:each="line : ${logLines}" class="log-line" th:text="${line}">
                    Log line content
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="d-flex gap-2">
                    <a href="/admin/logs/file" class="btn btn-primary">
                        <i class="fas fa-sync me-1"></i>Refresh Logs
                    </a>
                    <form th:action="@{/admin/logs/clear}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger" 
                                onclick="return confirm('Are you sure you want to clear all logs? This action cannot be undone!')">
                            <i class="fas fa-trash-alt me-1"></i>Clear All Logs
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
