<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - City Park Solutions Pvt Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            /* Color Palette from Image */
            --color-navy-darkest: #1e2a3a;
            --color-navy-dark: #2c3e50;
            --color-navy-medium: #34495e;
            --color-slate-blue: #4a5f7a;
            --color-blue-gray: #7f8c8d;
            --color-gray-medium: #95a5a6;
            --color-gray-light: #bdc3c7;
            --color-gray-lightest: #ecf0f1;
            
            /* UI Colors */
            --primary-blue: #4a5f7a;
            --primary-dark: #2c3e50;
            --text-dark: #1e2a3a;
            --text-light: #7f8c8d;
            --bg-light: #ecf0f1;
            --shadow-sm: 0 1px 2px 0 rgba(30, 42, 58, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(30, 42, 58, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(30, 42, 58, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(30, 42, 58, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--color-navy-darkest) 0%, var(--color-navy-dark) 25%, var(--color-navy-medium) 50%, var(--color-blue-gray) 75%, var(--color-gray-lightest) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-container {
            width: 100%;
            max-width: 550px;
            position: relative;
        }

        .register-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(30, 42, 58, 0.15);
            border: 1px solid rgba(74, 95, 122, 0.1);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            color: white;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-lg);
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            color: var(--color-slate-blue);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--color-navy-dark);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .form-control {
            border: 2px solid rgba(74, 95, 122, 0.1);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            border-color: var(--color-slate-blue);
            box-shadow: 0 0 0 0.2rem rgba(74, 95, 122, 0.15);
            background: rgba(255, 255, 255, 0.95);
            outline: none;
        }

        .form-control.is-valid {
            border-color: #27ae60;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%2327ae60' d='m2.3 6.73.94-.94 2.94 2.94L8.5 6.4l.94.94L6.5 10.27z'/%3e%3c/svg%3e");
        }

        .form-control.is-invalid {
            border-color: #e74c3c;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23e74c3c'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath d='m5.5 5.5 1 1m0-1-1 1'/%3e%3c/svg%3e");
        }

        .password-requirements {
            font-size: 0.8rem;
            color: var(--color-slate-blue);
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .btn-register {
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .btn-register:hover {
            background: linear-gradient(135deg, var(--color-navy-medium), var(--color-navy-dark));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            color: white;
        }

        .btn-register:disabled {
            background: var(--color-gray-medium);
            transform: none;
            box-shadow: var(--shadow-sm);
            cursor: not-allowed;
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(192, 57, 43, 0.1));
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(74, 95, 122, 0.1);
        }

        .login-link a {
            color: var(--color-slate-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: var(--color-navy-dark);
            text-decoration: underline;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }

        .floating-shape:nth-child(1) {
            top: 15%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            top: 60%;
            right: 10%;
            animation-delay: 3s;
        }

        .floating-shape:nth-child(3) {
            bottom: 25%;
            left: 15%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .brand-title {
                font-size: 1.5rem;
            }
        }
    </style>
    <script>
        function validatePasswords() {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordField = document.getElementById("password");
            const confirmField = document.getElementById("confirmPassword");
            
            // Reset validation classes
            passwordField.classList.remove('is-valid', 'is-invalid');
            confirmField.classList.remove('is-valid', 'is-invalid');
            
            if (password !== confirmPassword) {
                confirmField.classList.add('is-invalid');
                showAlert("Passwords do not match!", "danger");
                return false;
            } else if (password.length > 0) {
                confirmField.classList.add('is-valid');
            }
            
            return true;
        }

        function validatePassword() {
            const password = document.getElementById("password").value;
            const passwordField = document.getElementById("password");
            const pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,12}$/;
            
            if (pattern.test(password)) {
                passwordField.classList.remove('is-invalid');
                passwordField.classList.add('is-valid');
            } else if (password.length > 0) {
                passwordField.classList.remove('is-valid');
                passwordField.classList.add('is-invalid');
            }
        }

        function showAlert(message, type) {
            // Create alert element
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="bi bi-exclamation-circle me-2"></i>${message}`;
            
            // Insert at top of form
            const form = document.querySelector('form');
            form.parentNode.insertBefore(alertDiv, form);
            
            // Remove after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('password').addEventListener('input', validatePassword);
            document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
        });
    </script>
</head>
<body>

<!-- Floating Background Shapes -->
<div class="floating-shapes">
    <div class="floating-shape">
        <i class="bi bi-person-plus" style="font-size: 3rem; color: var(--color-gray-light);"></i>
    </div>
    <div class="floating-shape">
        <i class="bi bi-shield-check" style="font-size: 2.5rem; color: var(--color-gray-light);"></i>
    </div>
    <div class="floating-shape">
        <i class="bi bi-envelope" style="font-size: 2rem; color: var(--color-gray-light);"></i>
    </div>
</div>

<div class="register-container">
    <div class="register-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-logo">CPS</div>
            <h1 class="brand-title">Join Us Today</h1>
            <p class="brand-subtitle">Create your City Park Solutions account</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Register Form -->
        <form th:action="@{/register}" method="post" th:object="${user}" onsubmit="return validatePasswords()">
            <!-- Name Fields Row -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-person me-2"></i>First Name
                    </label>
                    <input type="text" th:field="*{firstName}" class="form-control" 
                           placeholder="Enter first name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-person me-2"></i>Last Name
                    </label>
                    <input type="text" th:field="*{lastName}" class="form-control" 
                           placeholder="Enter last name" required>
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-envelope me-2"></i>Email Address
                </label>
                <input type="email" th:field="*{email}" class="form-control"
                       pattern="^[^@]+@[^@]+\.[^@]+$"
                       placeholder="Enter your email address"
                       title="Must be a valid email with @ and ." required>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-lock me-2"></i>Password
                </label>
                <input type="password" th:field="*{passwordHash}" id="password" class="form-control"
                       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,12}$"
                       placeholder="Create a strong password" required>
                <div class="password-requirements">
                    Password must be 8-12 characters with uppercase, lowercase, number & special character
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-lock-fill me-2"></i>Confirm Password
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" 
                       placeholder="Confirm your password" required>
            </div>

            <!-- Phone Number Field -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-telephone me-2"></i>Phone Number
                </label>
                <input type="text" th:field="*{phoneNumber}" class="form-control"
                       pattern="^0\d{9}$" 
                       placeholder="0771234567"
                       title="Phone must be 10 digits starting with 0" required>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="btn-register">
                    <i class="bi bi-person-plus me-2"></i>
                    Create Account
                </button>
            </div>
        </form>

        <!-- Login Link -->
        <div class="login-link">
            <p class="mb-0">
                Already have an account? 
                <a th:href="@{/login}">Sign in here</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
