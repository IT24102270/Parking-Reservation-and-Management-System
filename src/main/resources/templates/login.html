<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City Park Solutions Pvt Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            /* Color Palette from Image */
            --color-navy-darkest: #1e2a3a;
            --color-navy-dark: #2c3e50;
            --color-navy-medium: #34495e;
            --color-slate-blue: #4a5f7a;
            --color-blue-gray: #7f8c8d;
            --color-gray-medium: #95a5a6;
            --color-gray-light: #bdc3c7;
            --color-gray-lightest: #ecf0f1;
            
            /* UI Colors */
            --primary-blue: #4a5f7a;
            --primary-dark: #2c3e50;
            --text-dark: #1e2a3a;
            --text-light: #7f8c8d;
            --bg-light: #ecf0f1;
            --shadow-sm: 0 1px 2px 0 rgba(30, 42, 58, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(30, 42, 58, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(30, 42, 58, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(30, 42, 58, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--color-navy-darkest) 0%, var(--color-navy-dark) 25%, var(--color-navy-medium) 50%, var(--color-blue-gray) 75%, var(--color-gray-lightest) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .login-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(30, 42, 58, 0.15);
            border: 1px solid rgba(74, 95, 122, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            color: white;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-lg);
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            color: var(--color-slate-blue);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--color-navy-dark);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            border: 2px solid rgba(74, 95, 122, 0.1);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-control:focus {
            border-color: var(--color-slate-blue);
            box-shadow: 0 0 0 0.2rem rgba(74, 95, 122, 0.15);
            background: rgba(255, 255, 255, 0.95);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--color-navy-medium), var(--color-navy-dark));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            color: white;
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(192, 57, 43, 0.1));
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.1), rgba(46, 204, 113, 0.1));
            color: #27ae60;
            border: 1px solid rgba(39, 174, 96, 0.2);
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(74, 95, 122, 0.1), rgba(52, 73, 94, 0.1));
            color: var(--color-slate-blue);
            border: 1px solid rgba(74, 95, 122, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(74, 95, 122, 0.1);
        }

        .register-link a {
            color: var(--color-slate-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: var(--color-navy-dark);
            text-decoration: underline;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }

        .floating-shape:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            top: 70%;
            right: 15%;
            animation-delay: 3s;
        }

        .floating-shape:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .brand-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Floating Background Shapes -->
<div class="floating-shapes">
    <div class="floating-shape">
        <i class="bi bi-car-front" style="font-size: 3rem; color: var(--color-gray-light);"></i>
    </div>
    <div class="floating-shape">
        <i class="bi bi-shield-check" style="font-size: 2.5rem; color: var(--color-gray-light);"></i>
    </div>
    <div class="floating-shape">
        <i class="bi bi-geo-alt" style="font-size: 2rem; color: var(--color-gray-light);"></i>
    </div>
</div>

<div class="login-container">
    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-logo">CPS</div>
            <h1 class="brand-title">Welcome Back</h1>
            <p class="brand-subtitle">Sign in to City Park Solutions</p>
        </div>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-2"></i>
            Invalid email or password
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            You have been logged out successfully
        </div>
        <div th:if="${param.success}" class="alert alert-success">
            <i class="bi bi-check-circle me-2"></i>
            Registration successful! Please log in
        </div>
        <div th:if="${session.error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${session.error}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope me-2"></i>Email Address
                </label>
                <input type="text" id="email" name="username" class="form-control" 
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="bi bi-lock me-2"></i>Password
                </label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Sign In
                </button>
            </div>
        </form>

        <!-- Register Link -->
        <div class="register-link">
            <p class="mb-0">
                Don't have an account? 
                <a th:href="@{/register}">Create one here</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
