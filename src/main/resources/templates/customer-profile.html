<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - City Park Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Enhanced Color Palette */
            --color-navy-darkest: #1e2a3a;
            --color-navy-dark: #2c3e50;
            --color-navy-medium: #34495e;
            --color-slate-blue: #4a5f7a;
            --color-blue-gray: #7f8c8d;
            --color-gray-medium: #95a5a6;
            --color-gray-light: #bdc3c7;
            --color-gray-lightest: #ecf0f1;
            
            /* UI Colors */
            --primary-blue: #4a5f7a;
            --dark-blue: #2c3e50;
            --text-color: #1e2a3a;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(30, 42, 58, 0.1);
            --shadow-md: 0 8px 16px rgba(30, 42, 58, 0.1);
            --shadow-lg: 0 16px 32px rgba(30, 42, 58, 0.15);
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --info-color: #3498db;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--color-navy-darkest) 0%, var(--color-navy-dark) 25%, var(--color-navy-medium) 50%, var(--color-blue-gray) 75%, var(--color-gray-lightest) 100%);
            min-height: 100vh;
            color: var(--text-color);
        }

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .profile-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(74, 95, 122, 0.1);
            text-align: center;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: var(--shadow-md);
        }
        
        .profile-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 10px;
        }
        
        .profile-email {
            font-size: 16px;
            color: var(--color-slate-blue);
            margin-bottom: 20px;
        }
        
        .profile-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-navy-medium));
            color: white;
            box-shadow: var(--shadow);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--color-navy-medium), var(--color-navy-dark));
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background: rgba(74, 95, 122, 0.1);
            color: var(--color-slate-blue);
            border: 2px solid var(--color-slate-blue);
        }
        
        .btn-secondary:hover {
            background: var(--color-slate-blue);
            color: white;
            transform: translateY(-2px);
        }
        
        .profile-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .profile-section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(236, 240, 241, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(74, 95, 122, 0.1);
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-navy-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: var(--color-slate-blue);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            color: var(--color-navy-dark);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--color-gray-light);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-color);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-slate-blue);
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 95, 122, 0.1);
        }
        
        .form-input:disabled {
            background: var(--color-gray-lightest);
            color: var(--text-light);
            cursor: not-allowed;
            border-color: var(--color-gray-medium);
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }
        
        .alert-success {
            background: rgba(39, 174, 96, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(39, 174, 96, 0.3);
        }
        
        .alert-error {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger-color);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        
        .password-section {
            grid-column: 1 / -1;
        }
        
        .password-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .profile-content {
                grid-template-columns: 1fr;
            }
            
            .profile-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .password-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">CPS</div>
                <div class="logo-text">City Park Solutions</div>
            </div>
            
            <nav>
                <ul class="nav-menu">
                    <li><a href="/customer/dashboard">Dashboard</a></li>
                    <li><a href="/customer/bookings">Bookings</a></li>
                    <li><a href="/customer/slots">Slots</a></li>
                    <li><a href="/customer/support">Get Help</a></li>
                    <li><a href="/customer/feedback">Feedback</a></li>
                    <li><a href="/customer/profile" class="active">Profile</a></li>
                </ul>
            </nav>
            
            <div class="user-profile">
                <div class="user-info">
                    <div class="user-avatar" th:text="${user != null and user.firstName != null and user.lastName != null ? (#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)) : 'DA'}">DA</div>
                    <div class="user-details">
                        <div class="user-name" th:text="${user != null and user.firstName != null and user.lastName != null ? (user.firstName + ' ' + user.lastName) : 'Customer User'}">Customer User</div>
                        <div class="user-role">Premium User</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="profile-container">
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}">Success message</span>
            </div>
            
            <div th:if="${error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-avatar" th:text="${user != null and user.firstName != null and user.lastName != null ? (#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)) : 'DA'}">DA</div>
                <div class="profile-name" th:text="${user != null and user.firstName != null and user.lastName != null ? (user.firstName + ' ' + user.lastName) : 'Customer User'}">Customer User</div>
                <div class="profile-email" th:text="${user != null ? user.email : 'customer@example.com'}">customer@example.com</div>
                
                <div class="profile-actions">
                    <a th:href="${editMode ? '/customer/profile' : '/customer/profile/edit'}" class="btn btn-primary">
                        <i th:class="${editMode ? 'fas fa-eye' : 'fas fa-edit'}"></i>
                        <span th:text="${editMode ? 'View Profile' : 'Edit Profile'}">Edit Profile</span>
                    </a>
                    <a href="/customer/dashboard" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i>
                        Back to Dashboard
                    </a>
                </div>
            </div>

            <!-- Profile Content -->
            <div class="profile-content">
                <!-- Personal Information -->
                <div class="profile-section">
                    <h2 class="section-title">
                        <i class="fas fa-user"></i>
                        Personal Information
                    </h2>
                    
                    <form th:if="${editMode}" th:action="@{/customer/profile/update}" method="post" th:object="${user}">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-input" th:field="*{firstName}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-input" th:field="*{lastName}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-input" th:field="*{phoneNumber}">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Save Changes
                        </button>
                    </form>
                    
                    <div th:unless="${editMode}">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-input" th:value="${user?.firstName}" disabled>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-input" th:value="${user?.lastName}" disabled>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-input" th:value="${user?.phoneNumber ?: 'Not provided'}" disabled>
                        </div>
                    </div>
                </div>

                <!-- Account Information -->
                <div class="profile-section">
                    <h2 class="section-title">
                        <i class="fas fa-id-card"></i>
                        Account Information
                    </h2>
                    
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" th:value="${user?.email}" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">User Role</label>
                        <input type="text" class="form-input" th:value="${user?.role ?: 'CUSTOMER'}" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Account Status</label>
                        <input type="text" class="form-input" th:value="${user?.status ?: 'ACTIVE'}" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Member Since</label>
                        <input type="text" class="form-input" th:value="${user?.created_at != null ? #temporals.format(user.created_at, 'MMM dd, yyyy') : 'N/A'}" disabled>
                    </div>
                </div>

                <!-- Change Password Section -->
                <div class="profile-section password-section" th:if="${editMode}">
                    <h2 class="section-title">
                        <i class="fas fa-lock"></i>
                        Change Password
                    </h2>
                    
                    <form th:action="@{/customer/profile/change-password}" method="post">
                        <div class="password-form">
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" class="form-input" name="currentPassword" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-input" name="newPassword" required minlength="6">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" class="form-input" name="confirmPassword" required minlength="6">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-key"></i>
                            Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
