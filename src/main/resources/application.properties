spring.application.name=Parking_Reservation_and_Management_System

# ===========================================
# SQL Server Database Configuration
# ===========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ParkingSystemDB;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=789

# ===========================================
# Hibernate Configuration
# ===========================================
# ? KEY CHANGE: Use 'update' to prevent dropping tables and preserve data
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the log
spring.jpa.show-sql=true

# Specify the SQL Server dialect (though often auto-detected)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Use a standard naming strategy for table and column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Recommended to disable this to prevent performance issues
spring.jpa.open-in-view=false

# ===========================================
# Server Configuration
# ===========================================
server.port=8080

# ===========================================
# Logging Configuration
# ===========================================
# Show the values bound to parameters in SQL logs for easier debugging
logging.level.org.hibernate.type.descriptor.sql=trace